<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tweet Reach Predictor</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gradient-to-b from-gray-900 via-gray-800 to-gray-900 text-gray-100 min-h-screen flex items-center justify-center p-6">
    <div class="max-w-3xl w-full">
      <header class="mb-6 text-center">
        <h1 class="text-3xl font-extrabold tracking-tight">Tweet Reach Predictor</h1>
        <p class="text-gray-300 mt-2">Hızlı analiz — en iyi etkileşim ihtimallerini tahmin eder.</p>
      </header>

      <main class="bg-white/5 backdrop-blur rounded-2xl p-6 shadow-lg">
        <label class="block text-sm font-semibold mb-2">Tweet (maks 280 karakter)</label>
        <textarea id="tweetInput" rows="4" maxlength="280" class="w-full p-4 rounded-xl bg-gray-900 text-gray-100 placeholder-gray-400 border border-gray-700"></textarea>

        <div class="mt-4 flex items-center gap-3">
          <button id="analyzeBtn" class="px-5 py-2 rounded-full bg-gradient-to-r from-green-400 to-blue-500 text-black font-bold shadow-lg hover:opacity-90">Analyze</button>
          <button id="clearBtn" class="px-4 py-2 rounded-full border border-gray-700 text-gray-200">Clear</button>
          <div id="loader" class="hidden ml-auto text-sm text-gray-400">Analiz ediliyor...</div>
        </div>

        <section id="result" class="hidden mt-6 bg-black/30 p-4 rounded-xl border border-gray-700">
          <div class="flex items-center justify-between mb-3">
            <div class="text-sm text-gray-300" id="toneValue">Sentiment: —</div>
            <div class="text-sm text-gray-300" id="scoreValue">Score: —</div>
          </div>

          <div class="w-full bg-gray-800 h-4 rounded-lg overflow-hidden mb-3">
            <div id="scoreBar" class="h-4 w-0 rounded-lg transition-all duration-700"></div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <h3 class="text-sm font-semibold text-gray-300">Reasons</h3>
              <ul id="reasonsList" class="mt-2 text-gray-200 list-disc ml-5"></ul>
            </div>
            <div>
              <h3 class="text-sm font-semibold text-gray-300">Suggestions</h3>
              <ul id="suggestionsList" class="mt-2 text-gray-200 list-disc ml-5"></ul>
            </div>
          </div>
        </section>
      </main>

      <footer class="mt-6 text-center text-xs text-gray-500">Deploy-ready for Vercel • FastAPI backend • TextBlob sentiment</footer>
    </div>

    <script src="/script.js"></script>
  </body>
</html>
